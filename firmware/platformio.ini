; CYD-iPod — PlatformIO project for ESP32-2432S028 (Cheap Yellow Display)
; Board: ESP-WROOM-32, 2.8" ST7789 (or ILI9341 — see build flags)

[env:cyd_st7789]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L

lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
  earlephilhower/ESP8266Audio @ 1.9.9
  https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.12

build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  -D USE_HSPI_PORT=1
  -D TFT_INVERSION_ON=1
  -D BOARD_HAS_PSRAM=0
  ; Audio / BT stack needs a bit of heap headroom
  -D CONFIG_BT_ALLOC_QUALITY_CONTROL_HEAP_SIZE=4096

; Alternate panel: comment [env:cyd_st7789] and use this if colours are wrong / blank
[env:cyd_ili9341]
extends = env:cyd_st7789
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  -D USE_HSPI_PORT=1
  -D BOARD_HAS_PSRAM=0
